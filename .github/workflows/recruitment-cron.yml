name: Recruitment scheduled tasks

on:
  schedule:
    - cron: '7,37 * * * *'
    - cron: '13 9 * * *'
  workflow_dispatch:

permissions: {}
concurrency:
  group: recruitment-cron-production
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CRON_SECRET: ${{ secrets.EMPREGOSTP_CRON_SECRET }}
      EVENT_NAME: ${{ github.event_name }}
      EVENT_SCHEDULE: ${{ github.event.schedule }}
    steps:
      - name: Dispatch scheduled tasks and transactional notifications
        run: |
          node --input-type=module <<'JS'
          if (!process.env.CRON_SECRET) throw new Error('EMPREGOSTP_CRON_SECRET_REQUIRED');
          const manual = process.env.EVENT_NAME === 'workflow_dispatch';
          const daily = process.env.EVENT_SCHEDULE === '13 9 * * *';
          const paths = manual || !daily ? ['/api/cron/interview-reminders', '/api/cron/expire-offers'] : [];
          if (manual || daily) paths.push('/api/cron/ats-daily');
          paths.push('/api/cron/process-outbox');
          let failed = false;
          for (const path of paths) {
            try {
              const response = await fetch(`https://empregostp.com${path}`, {
                method: 'POST', redirect: 'error',
                headers: { Authorization: `Bearer ${process.env.CRON_SECRET}` },
                signal: AbortSignal.timeout(60000),
              });
              const data = await response.json().catch(() => ({}));
              const ok = response.ok && data.status === 'processed' && (path !== '/api/cron/process-outbox' || (data.failed === 0 && data.leaseLost === 0));
              console.log(JSON.stringify({ path, status: response.status, ok, ...(path === '/api/cron/process-outbox' ? { failed: data.failed, leaseLost: data.leaseLost } : {}) }));
              if (!ok) failed = true;
            } catch { failed = true; console.log(JSON.stringify({ path, ok: false, code: 'DISPATCH_FAILED' })); }
          }
          if (failed) process.exitCode = 1;
          JS
