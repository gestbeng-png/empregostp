<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Shape -->
  <rect width="400" height="300" rx="20" fill="#E6F7EF" />
  
  <!-- Office Building -->
  <rect x="50" y="80" width="140" height="180" rx="5" fill="#34D399" />
  <rect x="60" y="100" width="30" height="30" rx="2" fill="white" />
  <rect x="100" y="100" width="30" height="30" rx="2" fill="white" />
  <rect x="140" y="100" width="30" height="30" rx="2" fill="white" />
  <rect x="60" y="140" width="30" height="30" rx="2" fill="white" />
  <rect x="100" y="140" width="30" height="30" rx="2" fill="white" />
  <rect x="140" y="140" width="30" height="30" rx="2" fill="white" />
  <rect x="60" y="180" width="30" height="30" rx="2" fill="white" />
  <rect x="100" y="180" width="30" height="30" rx="2" fill="white" />
  <rect x="140" y="180" width="30" height="30" rx="2" fill="white" />
  <rect x="90" y="230" width="60" height="30" rx="2" fill="white" />
  
  <!-- Person 1 -->
  <circle cx="240" cy="150" r="30" fill="#0D9488" />
  <rect x="225" y="190" width="30" height="70" rx="5" fill="#0D9488" />
  <rect x="215" y="200" width="10" height="40" rx="5" fill="#0D9488" />
  <rect x="255" y="200" width="10" height="40" rx="5" fill="#0D9488" />
  
  <!-- Person 2 -->
  <circle cx="300" cy="160" r="25" fill="#047857" />
  <rect x="287.5" y="190" width="25" height="60" rx="5" fill="#047857" />
  <rect x="277.5" y="200" width="10" height="30" rx="5" fill="#047857" />
  <rect x="312.5" y="200" width="10" height="30" rx="5" fill="#047857" />
  
  <!-- Document/Resume -->
  <rect x="330" y="120" width="50" height="70" rx="5" fill="white" stroke="#34D399" stroke-width="2" />
  <line x1="340" y1="135" x2="370" y2="135" stroke="#34D399" stroke-width="2" />
  <line x1="340" y1="145" x2="370" y2="145" stroke="#34D399" stroke-width="2" />
  <line x1="340" y1="155" x2="360" y2="155" stroke="#34D399" stroke-width="2" />
  <line x1="340" y1="165" x2="370" y2="165" stroke="#34D399" stroke-width="2" />
  <line x1="340" y1="175" x2="360" y2="175" stroke="#34D399" stroke-width="2" />
  
  <!-- Decorative Elements -->
  <circle cx="50" cy="50" r="20" fill="#10B981" opacity="0.3" />
  <circle cx="350" cy="70" r="15" fill="#10B981" opacity="0.3" />
  <circle cx="330" cy="250" r="25" fill="#10B981" opacity="0.3" />
