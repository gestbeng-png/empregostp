<svg width="400" height="300" viewBox="0 0 400 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Shape -->
  <rect width="400" height="300" rx="20" fill="#EBF5FF" />
  
  <!-- Person with Laptop -->
  <circle cx="150" cy="120" r="35" fill="#3B82F6" />
  <rect x="130" y="160" width="40" height="80" rx="5" fill="#3B82F6" />
  <rect x="120" y="170" width="10" height="50" rx="5" fill="#3B82F6" />
  <rect x="170" y="170" width="10" height="50" rx="5" fill="#3B82F6" />
  
  <!-- Laptop -->
  <rect x="200" y="150" width="120" height="80" rx="5" fill="#1E40AF" />
  <rect x="210" y="160" width="100" height="60" rx="2" fill="white" />
  <rect x="180" y="230" width="160" height="10" rx="5" fill="#1E40AF" />
  
  <!-- Resume/CV -->
  <rect x="70" y="100" width="60" height="80" rx="5" fill="white" stroke="#3B82F6" stroke-width="2" />
  <line x1="80" y1="115" x2="120" y2="115" stroke="#3B82F6" stroke-width="2" />
  <line x1="80" y1="125" x2="120" y2="125" stroke="#3B82F6" stroke-width="2" />
  <line x1="80" y1="135" x2="110" y2="135" stroke="#3B82F6" stroke-width="2" />
  <line x1="80" y1="145" x2="120" y2="145" stroke="#3B82F6" stroke-width="2" />
  <line x1="80" y1="155" x2="110" y2="155" stroke="#3B82F6" stroke-width="2" />
  <line x1="80" y1="165" x2="120" y2="165" stroke="#3B82F6" stroke-width="2" />
  
  <!-- Job Cards -->
  <rect x="280" y="80" width="80" height="50" rx="5" fill="white" stroke="#3B82F6" stroke-width="2" />
  <line x1="290" y1="95" x2="350" y2="95" stroke="#3B82F6" stroke-width="2" />
  <line x1="290" y1="105" x2="330" y2="105" stroke="#3B82F6" stroke-width="2" />
  <line x1="290" y1="115" x2="350" y2="115" stroke="#3B82F6" stroke-width="2" />
  
  <rect x="300" y="140" width="80" height="50" rx="5" fill="white" stroke="#3B82F6" stroke-width="2" />
  <line x1="310" y1="155" x2="370" y2="155" stroke="#3B82F6" stroke-width="2" />
  <line x1="310" y1="165" x2="350" y2="165" stroke="#3B82F6" stroke-width="2" />
  <line x1="310" y1="175" x2="370" y2="175" stroke="#3B82F6" stroke-width="2" />
  
  <rect x="320" y="200" width="80" height="50" rx="5" fill="white" stroke="#3B82F6" stroke-width="2" />
  <line x1="330" y1="215" x2="390" y2="215" stroke="#3B82F6" stroke-width="2" />
  <line x1="330" y1="225" x2="370" y2="225" stroke="#3B82F6" stroke-width="2" />
  <line x1="330" y1="235" x2="390" y2="235" stroke="#3B82F6" stroke-width="2" />
  
  <!-- Decorative Elements -->
  <circle cx="50" cy="50" r="20" fill="#60A5FA" opacity="0.3" />
  <circle cx="350" cy="40" r="15" fill="#60A5FA" opacity="0.3" />
  <circle cx="70" cy="250" r="25" fill="#60A5FA" opacity="0.3" />
</svg>